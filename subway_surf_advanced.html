<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Subway Surf - Dev Bahri</title>
    <!-- Tailwind CSS for UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;700;900&display=swap');

        :root {
            --primary: #ff4757;
            --secondary: #2ed573;
            --accent: #ffa502;
            --dark: #2f3542;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky fallback */
            font-family: 'Poppins', sans-serif;
            touch-action: none; /* Disable browser swipe gestures */
            user-select: none;
        }

        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Typography */
        .title-main {
            font-family: 'Bangers', cursive;
            font-size: clamp(4rem, 10vw, 7rem);
            color: #f1c40f;
            text-shadow: 4px 4px 0px #e67e22, 8px 8px 0px #000;
            letter-spacing: 3px;
            margin: 0;
            line-height: 1;
            text-align: center;
            transform: rotate(-3deg);
            animation: float 3s ease-in-out infinite;
        }

        .subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-top: 5px;
            letter-spacing: 6px;
            text-transform: lowercase;
            transform: rotate(-3deg);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }

        /* Buttons */
        .btn {
            font-family: 'Bangers', cursive;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: white;
            padding: 15px 40px;
            margin: 10px;
            border: 4px solid white;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.1s ease;
            box-shadow: 0 8px 0px rgba(0,0,0,0.4), 0 15px 20px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .btn-play { background: linear-gradient(to bottom, #2ed573, #20bf6b); box-shadow: 0 8px 0px #1e90ff, 0 15px 20px rgba(0,0,0,0.3); }
        .btn-play:active { transform: translateY(8px); box-shadow: 0 0px 0px #1e90ff; }
        
        .btn-menu { background: linear-gradient(to bottom, #ff4757, #ff6b81); box-shadow: 0 8px 0px #c0392b, 0 15px 20px rgba(0,0,0,0.3); }
        .btn-menu:active { transform: translateY(8px); box-shadow: 0 0px 0px #c0392b; }

        .btn-char { background: linear-gradient(to bottom, #3742fa, #5352ed); box-shadow: 0 8px 0px #1e3799, 0 15px 20px rgba(0,0,0,0.3); }
        .btn-char:active { transform: translateY(8px); box-shadow: 0 0px 0px #1e3799; }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            color: white;
            font-family: 'Bangers', cursive;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            text-shadow: 3px 3px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            pointer-events: none;
        }

        .stat-line { display: flex; align-items: center; margin-bottom: 5px; }
        .coin-icon { width: 30px; height: 30px; background: #f1c40f; border-radius: 50%; border: 3px solid #f39c12; margin-right: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.8); }

        /* Character Selection Cards */
        .char-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: white;
            width: 220px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .char-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.2); }
        .char-card.selected { border-color: #2ed573; background: rgba(46, 213, 115, 0.2); box-shadow: 0 0 20px rgba(46, 213, 115, 0.5); transform: scale(1.05); }
        
        .char-name { font-family: 'Bangers', cursive; font-size: 2rem; color: #f1c40f; text-shadow: 2px 2px 0px #000; margin-bottom: 10px; }
        .char-stat { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 2px; }
        
        /* Loading Overlay */
        #loading-screen { background: #1e272e; z-index: 100; color: white; font-family: 'Bangers'; font-size: 3rem; }
    </style>
</head>
<body>

    <!-- WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- In-Game HUD -->
    <div id="hud" class="hidden">
        <div class="stat-line">
            <span id="score-display">Score: 0</span>
        </div>
        <div class="stat-line">
            <div class="coin-icon"></div>
            <span id="coin-display">0</span>
        </div>
        <div id="multiplier-display" class="text-sm font-sans text-yellow-300 mt-1 drop-shadow-md"></div>
    </div>

    <!-- Intro / Home Menu -->
    <div id="menu-screen" class="ui-layer interactive">
        <h1 class="title-main">SUBWAY SURF</h1>
        <div class="subtitle">dev bahri</div>
        <div class="mt-12 flex flex-col items-center gap-4">
            <button id="btn-start-game" class="btn btn-play">PLAY</button>
            <button id="btn-open-chars" class="btn btn-char" style="font-size: 1.5rem; padding: 10px 30px;">CHARACTERS</button>
        </div>
        <div class="absolute bottom-5 text-white/50 text-sm font-bold text-center">
            Controls: WASD / Arrows / Swipe<br>Jump / Duck to avoid obstacles!
        </div>
    </div>

    <!-- Character Selection Screen -->
    <div id="char-select-screen" class="ui-layer interactive hidden">
        <h2 class="font-['Bangers'] text-5xl text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">SELECT RUNNER</h2>
        <div class="char-container" id="char-list">
            <!-- Populated by JS -->
        </div>
        <button id="btn-back-menu" class="btn btn-menu mt-8" style="font-size: 1.5rem; padding: 10px 30px;">BACK TO MENU</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="ui-layer interactive hidden">
        <h1 class="font-['Bangers'] text-6xl text-red-500 drop-shadow-[4px_4px_0_#8B0000]">BUSTED!</h1>
        <div class="bg-black/50 p-6 rounded-xl border-2 border-white/20 mt-6 text-center shadow-2xl">
            <div class="text-2xl text-gray-300 font-bold mb-2">FINAL SCORE</div>
            <div class="font-['Bangers'] text-5xl text-yellow-400 drop-shadow-lg mb-4" id="final-score">0</div>
            
            <div class="text-xl text-gray-300 font-bold mb-2">COINS GATHERED</div>
            <div class="font-['Bangers'] text-4xl text-white drop-shadow-lg flex justify-center items-center gap-2">
                <div class="coin-icon" style="margin:0;"></div> <span id="final-coins">0</span>
            </div>
        </div>
        <div class="flex gap-4 mt-8">
            <button id="btn-restart" class="btn btn-play">RUN AGAIN</button>
            <button id="btn-home" class="btn btn-menu" style="font-size: 1.5rem; padding: 12px 25px;">HOME</button>
        </div>
    </div>

    <!-- Loading Screen (Fades out when ready) -->
    <div id="loading-screen" class="ui-layer interactive">
        LOADING ASSETS...
    </div>

<script>
/**
 * -----------------------------------------------------------------------------
 * SUBWAY SURF CLONE - DEV BAHRI
 * Architecture:
 * 1. Global Config & State
 * 2. Audio Engine (Web Audio Synth)
 * 3. 3D Engine Setup (Scene, Camera, Lights)
 * 4. Game Objects (Player, World, Particles)
 * 5. Main Game Loop & Input handling
 * -----------------------------------------------------------------------------
 */

// ==========================================
// 1. CONFIGURATION, STATS & STATE
// ==========================================
const GAME_CONFIG = {
    laneWidth: 3.5,
    lanes: [-3.5, 0, 3.5], // Left, Center, Right
    gravity: -60, // Strong gravity for snappy jumps
    baseSpeed: 25,
    maxSpeed: 80,
    speedAcceleration: 0.3, // Speed increase per second
    chunkLength: 120, // Length of a terrain segment
    visibleChunks: 4, // Render distance
    playerStartZ: 10,
    trainSpeedMultiplier: 1.5 // Trains move faster than base game speed
};

const CHARACTERS = [
    { 
        id: 0, 
        name: "JAKE (DEFAULT)", 
        colors: { head: 0xffdbac, body: 0x3498db, limbs: 0x2c3e50 }, // Blue theme
        stats: { speedBase: 1.0, jumpHeight: 1.0, scoreMult: 1.0 },
        desc: "Balanced and reliable."
    },
    { 
        id: 1, 
        name: "TRICKY (SPEEDY)", 
        colors: { head: 0xffdbac, body: 0xe74c3c, limbs: 0x111111 }, // Red theme
        stats: { speedBase: 1.2, jumpHeight: 0.8, scoreMult: 1.5 },
        desc: "Starts faster, earns more, jumps lower."
    },
    { 
        id: 2, 
        name: "FRESH (JUMPER)", 
        colors: { head: 0x8d5524, body: 0x2ecc71, limbs: 0xf1c40f }, // Green/Gold theme
        stats: { speedBase: 0.9, jumpHeight: 1.4, scoreMult: 1.2 },
        desc: "Huge jumps to clear high obstacles."
    }
];

const GameState = { LOADING: 0, MENU: 1, CHAR_SELECT: 2, PLAYING: 3, GAMEOVER: 4, CUTSCENE: 5 };
let currentState = GameState.LOADING;
let selectedCharIndex = 0;
let cutsceneTime = 0;

// Gameplay Variables
let score = 0;
let coins = 0;
let gameSpeed = GAME_CONFIG.baseSpeed;
let distanceTraveled = 0;

// ==========================================
// 1.5 TEXTURE GENERATORS (Canvas to Three.js)
// ==========================================
function createTrackTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#5a5a5a'; ctx.fillRect(0,0,256,512); // Gravel Base
    ctx.fillStyle = '#3e2723'; // Wooden Ties
    for(let y=0; y<512; y+=64) ctx.fillRect(20, y+10, 216, 20);
    ctx.fillStyle = '#b0bec5'; // Metal Rails
    ctx.fillRect(50, 0, 10, 512);
    ctx.fillRect(196, 0, 10, 512);
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, GAME_CONFIG.chunkLength / 10);
    return tex;
}

function createBuildingMaterials() {
    const mats = [];
    const colors = ['#7f8c8d', '#95a5a6', '#e74c3c', '#3498db', '#f39c12'];
    colors.forEach(col => {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = col; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#ffffaa'; // Illuminated Windows
        for(let x=20; x<256; x+=60) {
            for(let y=20; y<256; y+=60) {
                if(Math.random() > 0.4) ctx.fillRect(x, y, 30, 40); // Light on
                else { ctx.fillStyle = '#222'; ctx.fillRect(x,y,30,40); ctx.fillStyle = '#ffffaa'; } // Light off
            }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        mats.push(new THREE.MeshLambertMaterial({ map: tex }));
    });
    return mats;
}

function createBankMaterial() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ecf0f1'; ctx.fillRect(0,0,512,256);
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 100px Impact'; ctx.textAlign = 'center';
    ctx.fillText('BANK', 256, 150);
    const tex = new THREE.CanvasTexture(canvas);
    return new THREE.MeshLambertMaterial({ map: tex });
}

// ==========================================
// 2. AUDIO ENGINE (Web Audio API Synthesizer)
// ==========================================
class SynthAudio {
    constructor() {
        this.ctx = null;
        this.initialized = false;
        this.masterVolume = null;
    }

    init() {
        if (this.initialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        
        this.masterVolume = this.ctx.createGain();
        this.masterVolume.gain.value = 0.3; // Global volume
        this.masterVolume.connect(this.ctx.destination);
        
        this.initialized = true;
    }

    playCoin() {
        if (!this.initialized) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        // Ding sound: high pitch, quick frequency drop
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.exponentialRampToValueAtTime(1800, t + 0.1);

        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);

        osc.connect(gain);
        gain.connect(this.masterVolume);
        
        osc.start(t);
        osc.stop(t + 0.3);
    }

    playJump() {
        if (!this.initialized) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        // Swoosh: sweep frequency up
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.2);

        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.4, t + 0.05);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);

        osc.connect(gain);
        gain.connect(this.masterVolume);
        
        osc.start(t);
        osc.stop(t + 0.2);
    }

    playCrash() {
        if (!this.initialized) return;
        const t = this.ctx.currentTime;
        
        // Generate noise buffer
        const bufferSize = this.ctx.sampleRate * 0.5; // 0.5 seconds
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1; // White noise
        }
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        
        // Filter to make it sound like a thud/crash
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, t);
        filter.frequency.exponentialRampToValueAtTime(100, t + 0.4);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterVolume);

        noise.start(t);
    }
}
const audio = new SynthAudio();

// ==========================================
// 3. 3D ENGINE SETUP
// ==========================================
const canvas = document.getElementById('game-canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 40, GAME_CONFIG.chunkLength * 2.5);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Lighting setup for depth and shadows
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
// Position light to cast shadows nicely backwards and slightly sideways
dirLight.position.set(-15, 40, 20); 
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 150;
const d = 40;
dirLight.shadow.camera.left = -d;
dirLight.shadow.camera.right = d;
dirLight.shadow.camera.top = d;
dirLight.shadow.camera.bottom = -d;
scene.add(dirLight);

// ==========================================
// 4. GAME OBJECTS
// ==========================================

// Helper: AABB Collision check
function checkCollision(box1, box2) {
    return box1.intersectsBox(box2);
}

// 4.1 Player Character (Hierarchical Model)
class Player {
    constructor() {
        this.group = new THREE.Group();
        // Camera slightly behind and above player
        this.group.position.set(0, 0, GAME_CONFIG.playerStartZ);
        
        // Mechanics state
        this.laneIndex = 1; // 0, 1, 2
        this.targetX = GAME_CONFIG.lanes[this.laneIndex];
        this.velocityY = 0;
        this.isJumping = false;
        this.isDucking = false;
        this.duckTimer = 0;
        this.animTime = 0;
        
        // Active Character Stats
        this.charData = CHARACTERS[0];
        
        this.materials = {};
        this.buildModel();
        scene.add(this.group);

        this.boundingBox = new THREE.Box3();
    }

    buildModel() {
        // Clear old if rebuilding
        while(this.group.children.length > 0){ 
            this.group.remove(this.group.children[0]); 
        }

        // Create Materials based on character
        this.materials.head = new THREE.MeshLambertMaterial({ color: this.charData.colors.head });
        this.materials.body = new THREE.MeshLambertMaterial({ color: this.charData.colors.body });
        this.materials.limbs = new THREE.MeshLambertMaterial({ color: this.charData.colors.limbs });

        // Geometry components
        this.head = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), this.materials.head);
        this.head.position.y = 2.6;
        this.head.castShadow = true;
        
        this.body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.8), this.materials.body);
        this.body.position.y = 1.3;
        this.body.castShadow = true;

        // Pivioted limbs for animation
        const limbGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
        
        this.armL = new THREE.Group();
        this.armL.position.set(-0.8, 2.0, 0);
        const amL = new THREE.Mesh(limbGeo, this.materials.limbs);
        amL.position.y = -0.6; amL.castShadow = true;
        this.armL.add(amL);

        this.armR = new THREE.Group();
        this.armR.position.set(0.8, 2.0, 0);
        const amR = new THREE.Mesh(limbGeo, this.materials.limbs);
        amR.position.y = -0.6; amR.castShadow = true;
        this.armR.add(amR);

        this.legL = new THREE.Group();
        this.legL.position.set(-0.35, 0.6, 0);
        const lgL = new THREE.Mesh(limbGeo, this.materials.limbs);
        lgL.position.y = -0.6; lgL.castShadow = true;
        this.legL.add(lgL);

        this.legR = new THREE.Group();
        this.legR.position.set(0.35, 0.6, 0);
        const lgR = new THREE.Mesh(limbGeo, this.materials.limbs);
        lgR.position.y = -0.6; lgR.castShadow = true;
        this.legR.add(lgR);

        // Backpack accessory
        const pack = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), this.materials.limbs);
        pack.position.set(0, 1.4, 0.6);
        pack.castShadow = true;

        this.group.add(this.head, this.body, this.armL, this.armR, this.legL, this.legR, pack);
    }

    setCharacter(index) {
        this.charData = CHARACTERS[index];
        this.buildModel();
    }

    update(dt) {
        if (currentState !== GameState.PLAYING) return;

        // Smooth horizontal movement (Lane switching)
        this.group.position.x += (this.targetX - this.group.position.x) * 15 * dt;

        // Physics: Gravity & Jumping
        this.velocityY += GAME_CONFIG.gravity * dt;
        this.group.position.y += this.velocityY * dt;

        // Floor collision
        if (this.group.position.y <= 0) {
            this.group.position.y = 0;
            this.velocityY = 0;
            if(this.isJumping) this.isJumping = false;
        }

        // Duck timer
        if (this.isDucking) {
            this.duckTimer -= dt;
            if (this.duckTimer <= 0) this.unduck();
        }

        this.animate(dt);
        
        // Update Hitbox. Make it slightly narrower than visual model to be forgiving
        this.boundingBox.setFromObject(this.group);
        this.boundingBox.expandByScalar(-0.2); 
    }

    animate(dt) {
        // Animation overrides for actions
        if (this.isJumping) {
            this.armL.rotation.x = -Math.PI/2; this.armR.rotation.x = Math.PI/2;
            this.legL.rotation.x = Math.PI/4; this.legR.rotation.x = -Math.PI/4;
            return;
        }
        if (this.isDucking) {
            this.armL.rotation.x = Math.PI/2; this.armR.rotation.x = Math.PI/2;
            this.legL.rotation.x = 0; this.legR.rotation.x = 0;
            return;
        }

        // Running cycle synced with game speed
        this.animTime += dt * gameSpeed * 0.7;
        const swing = Math.sin(this.animTime) * 1.5; // Leg swing amplitude
        
        this.armL.rotation.x = swing;
        this.armR.rotation.x = -swing;
        this.legL.rotation.x = -swing;
        this.legR.rotation.x = swing;

        // Subtle body bounce
        this.group.position.y = Math.abs(Math.sin(this.animTime * 2)) * 0.2;
    }

    moveLeft() {
        if (this.laneIndex > 0) {
            this.laneIndex--;
            this.targetX = GAME_CONFIG.lanes[this.laneIndex];
        }
    }

    moveRight() {
        if (this.laneIndex < 2) {
            this.laneIndex++;
            this.targetX = GAME_CONFIG.lanes[this.laneIndex];
        }
    }

    jump() {
        if (!this.isJumping && !this.isDucking) {
            this.isJumping = true;
            // Base jump velocity scaled by character stat
            this.velocityY = 24 * this.charData.stats.jumpHeight;
            audio.playJump();
        }
    }

    duck() {
        if (!this.isJumping && !this.isDucking) {
            this.isDucking = true;
            this.duckTimer = 0.8; // Duration
            // Squish down visually
            this.group.scale.y = 0.5;
            this.group.position.y = 0;
            audio.playJump(); // use jump sound for swooping down too
        }
    }

    unduck() {
        this.isDucking = false;
        this.group.scale.y = 1;
    }

    reset() {
        this.laneIndex = 1;
        this.targetX = GAME_CONFIG.lanes[this.laneIndex];
        this.group.position.set(0, 0, GAME_CONFIG.playerStartZ);
        this.group.rotation.set(0,0,0);
        this.group.scale.set(1,1,1);
        this.velocityY = 0;
        this.isJumping = false;
        this.isDucking = false;
        this.animTime = 0;
    }
}

// 4.2 Particle System for Visual Polish
class ParticleSystem {
    constructor() {
        this.particles = [];
        this.geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    }

    emit(x, y, z, color, count, velocityScale = 1) {
        const mat = new THREE.MeshBasicMaterial({ color: color });
        for(let i=0; i<count; i++) {
            const mesh = new THREE.Mesh(this.geometry, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            
            this.particles.push({
                mesh: mesh,
                vx: (Math.random() - 0.5) * 15 * velocityScale,
                vy: (Math.random()) * 15 * velocityScale + 5,
                vz: (Math.random() - 0.5) * 15 * velocityScale,
                life: 1.0
            });
        }
    }

    update(dt) {
        for(let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.life -= dt * 1.5; // fade rate
            
            p.vy += GAME_CONFIG.gravity * 0.5 * dt; // gravity
            p.mesh.position.x += p.vx * dt;
            p.mesh.position.y += p.vy * dt;
            p.mesh.position.z += p.vz * dt;
            p.mesh.rotation.x += 10 * dt;
            
            if(p.life <= 0 || p.mesh.position.y < 0) {
                scene.remove(p.mesh);
                this.particles.splice(i, 1);
            } else {
                p.mesh.scale.setScalar(p.life); // shrink
            }
        }
    }
}

// 4.3 World Management (Procedural Generation)
class WorldManager {
    constructor() {
        this.chunks = []; // Terrain segments
        this.obstacles = []; // Barriers, Trains
        this.coins = [];
        
        // Materials cache
        this.mats = {
            ground: new THREE.MeshLambertMaterial({ color: 0x2ecc71 }), // Grass green
            track: new THREE.MeshLambertMaterial({ map: createTrackTexture() }), // Textured tracks
            coin: new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 100 }),
            barrier: new THREE.MeshLambertMaterial({ color: 0xe74c3c }),
            barrierStripes: new THREE.MeshLambertMaterial({ color: 0xffffff }),
            trainBody: new THREE.MeshLambertMaterial({ color: 0x2980b9 }), // Blue train
            trainWindow: new THREE.MeshLambertMaterial({ color: 0x111111 }),
            wall: new THREE.MeshLambertMaterial({ color: 0xa52a2a }), // Red brick wall
            treeTrunk: new THREE.MeshLambertMaterial({ color: 0x5c4033 }), // Brown tree trunk
            treeLeaves: new THREE.MeshLambertMaterial({ color: 0x2e8b57 }), // Dark green foliage
            building: createBuildingMaterials(),
            bank: createBankMaterial()
        };

        this.geometries = {
            coin: new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16),
            barrierPole: new THREE.BoxGeometry(0.2, 3, 0.2),
            barrierBoard: new THREE.BoxGeometry(3, 1, 0.3),
            trainBase: new THREE.BoxGeometry(3.2, 3.5, 12),
            wall: new THREE.BoxGeometry(1.5, 4, 20), // Continuous wall segment
            trunk: new THREE.CylinderGeometry(0.6, 0.8, 5, 8), // Tree trunk
            leaves: new THREE.BoxGeometry(5, 5, 5) // Blocky pixel-art style leaves
        };
        this.geometries.coin.rotateX(Math.PI / 2); // Face forward

        // Endless Ground plane moving texture simulation
        const gGeo = new THREE.PlaneGeometry(150, GAME_CONFIG.chunkLength * GAME_CONFIG.visibleChunks);
        this.ground = new THREE.Mesh(gGeo, this.mats.ground);
        this.ground.rotation.x = -Math.PI / 2;
        this.ground.position.z = - (GAME_CONFIG.chunkLength * GAME_CONFIG.visibleChunks) / 2 + 50;
        this.ground.receiveShadow = true;
        scene.add(this.ground);

        this.initWorld();
    }

    initWorld() {
        // Pre-fill chunks ahead of player
        for (let i = 0; i < GAME_CONFIG.visibleChunks; i++) {
            this.spawnChunk(-i * GAME_CONFIG.chunkLength, i === 0); // First chunk is safe
        }
    }

    spawnChunk(zOffset, isSafeZone = false) {
        const chunkGroup = new THREE.Group();
        chunkGroup.position.z = zOffset;

        // Create Rails/Tracks
        for(let i=0; i<3; i++) {
            const track = new THREE.Mesh(new THREE.PlaneGeometry(GAME_CONFIG.laneWidth * 0.85, GAME_CONFIG.chunkLength), this.mats.track);
            track.rotation.x = -Math.PI / 2;
            track.position.set(GAME_CONFIG.lanes[i], 0.05, -GAME_CONFIG.chunkLength/2);
            track.receiveShadow = true;
            chunkGroup.add(track);
        }

        // City Outskirts Scenery (Layered: Trees -> Walls -> Skyline)
        for(let z = 0; z > -GAME_CONFIG.chunkLength; z -= 20) {
            [-1, 1].forEach(side => {
                // 1. Trees lining the tracks closely
                if(Math.random() > 0.1) {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(this.geometries.trunk, this.mats.treeTrunk);
                    trunk.position.y = 2.5; trunk.castShadow = true;
                    
                    const leaves = new THREE.Mesh(this.geometries.leaves, this.mats.treeLeaves);
                    leaves.position.y = 6.5; leaves.castShadow = true;
                    leaves.rotation.set(Math.random(), Math.random(), Math.random());
                    
                    tree.add(trunk, leaves);
                    tree.position.set(side * 6, 0, z - Math.random() * 8); // Close to tracks
                    chunkGroup.add(tree);
                }

                // 2. Brick Wall behind trees
                const wall = new THREE.Mesh(this.geometries.wall, this.mats.wall);
                wall.position.set(side * 9, 2, z - 10);
                wall.castShadow = true;
                wall.receiveShadow = true;
                chunkGroup.add(wall);

                // 3. City Skyline (Textured buildings)
                if(Math.random() > 0.15) {
                    const height = 25 + Math.random() * 45; // Tall buildings
                    const mat = this.mats.building[Math.floor(Math.random() * this.mats.building.length)];
                    const bldg = new THREE.Mesh(new THREE.BoxGeometry(15, height, 15), mat);
                    bldg.position.set(side * 22, height/2, z - Math.random() * 10);
                    bldg.castShadow = true;
                    bldg.receiveShadow = true;
                    chunkGroup.add(bldg);
                }
            });
        }

        scene.add(chunkGroup);
        this.chunks.push(chunkGroup);

        if (!isSafeZone) {
            this.generateHazards(zOffset);
        }
    }

    generateHazards(chunkZ) {
        const rows = 4; // Obstacle density per chunk
        const spacing = GAME_CONFIG.chunkLength / rows;

        for (let r = 0; r < rows; r++) {
            const zPos = chunkZ - (r * spacing) - (spacing/2);
            
            // Randomly decide lane contents. Rules: 
            // 0=Empty, 1=Coin Line, 2=Low Barrier (Jump), 3=High Barrier (Duck), 4=Moving Train
            let lanes = [0, 0, 0];
            let openLanes = 3;
            
            for(let i=0; i<3; i++) {
                const rand = Math.random();
                // Ensure at least one lane is navigable (not a train)
                if (rand < 0.15 && openLanes > 1) { 
                    lanes[i] = 4; // Train
                    openLanes--;
                } else if (rand < 0.3) {
                    lanes[i] = 2; // Jump
                } else if (rand < 0.45) {
                    lanes[i] = 3; // Duck
                } else if (rand < 0.8) {
                    lanes[i] = 1; // Coins
                }
            }

            // Instantiate based on lane type
            for(let i=0; i<3; i++) {
                const xPos = GAME_CONFIG.lanes[i];
                const type = lanes[i];

                if (type === 1) { // Coins
                    for(let c=0; c<3; c++) { // Line of 3
                        const coin = new THREE.Mesh(this.geometries.coin, this.mats.coin);
                        coin.position.set(xPos, 1, zPos + (c*3) - 3);
                        coin.castShadow = true;
                        scene.add(coin);
                        this.coins.push({ mesh: coin, box: new THREE.Box3() });
                    }
                } 
                else if (type === 2) { // Low Barrier (Jump)
                    const barrier = new THREE.Group();
                    const b = new THREE.Mesh(this.geometries.barrierBoard, this.mats.barrier);
                    b.position.y = 0.5; b.castShadow = true;
                    barrier.add(b);
                    barrier.position.set(xPos, 0, zPos);
                    scene.add(barrier);
                    // Hitbox
                    this.obstacles.push({ mesh: barrier, box: new THREE.Box3(), type: 'static' });
                }
                else if (type === 3) { // High Barrier (Duck)
                    const barrier = new THREE.Group();
                    const p1 = new THREE.Mesh(this.geometries.barrierPole, this.mats.track); p1.position.set(-1.4, 1.5, 0); p1.castShadow=true;
                    const p2 = new THREE.Mesh(this.geometries.barrierPole, this.mats.track); p2.position.set(1.4, 1.5, 0); p2.castShadow=true;
                    const board = new THREE.Mesh(this.geometries.barrierBoard, this.mats.barrier); board.position.y = 3.2; board.castShadow=true;
                    barrier.add(p1, p2, board);
                    barrier.position.set(xPos, 0, zPos);
                    scene.add(barrier);
                    
                    // Invisible Hitbox specifically for the TOP board, so ducking works
                    const hitbox = new THREE.Mesh(this.geometries.barrierBoard, new THREE.MeshBasicMaterial({visible:false}));
                    hitbox.position.set(xPos, 3.2, zPos);
                    scene.add(hitbox);
                    
                    this.obstacles.push({ mesh: barrier, hitbox: hitbox, box: new THREE.Box3(), type: 'static' });
                }
                else if (type === 4) { // Moving Train
                    const train = new THREE.Group();
                    const body = new THREE.Mesh(this.geometries.trainBase, this.mats.trainBody);
                    body.position.y = 1.75; body.castShadow = true;
                    // Front Window
                    const windowGeo = new THREE.PlaneGeometry(2.8, 1.5);
                    const win = new THREE.Mesh(windowGeo, this.mats.trainWindow);
                    win.position.set(0, 2.2, 6.01); // Front face
                    
                    train.add(body, win);
                    // Spawn further back so player has reaction time as it moves towards them
                    train.position.set(xPos, 0, zPos - 30); 
                    scene.add(train);
                    
                    this.obstacles.push({ mesh: train, box: new THREE.Box3(), type: 'moving' });
                }
            }
        }
    }

    update(dt, currentSpeed) {
        if(currentState !== GameState.PLAYING) return;

        // Base world movement speed (moving towards camera)
        const moveDist = currentSpeed * dt;

        // Chunks (Scenery)
        this.chunks.forEach(chunk => { chunk.position.z += moveDist; });

        // Recycle chunks when they pass the camera
        if (this.chunks[0].position.z > GAME_CONFIG.chunkLength) {
            const oldChunk = this.chunks.shift();
            const lastZ = this.chunks[this.chunks.length - 1].position.z;
            oldChunk.position.z = lastZ - GAME_CONFIG.chunkLength; // Move to end
            this.chunks.push(oldChunk);
            
            // Spawn new hazards for the recycled area
            this.generateHazards(oldChunk.position.z);
        }

        // Ground visual loop
        this.ground.position.z += moveDist;
        if(this.ground.position.z > 0) this.ground.position.z = -GAME_CONFIG.chunkLength;

        // Obstacles Update
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let obs = this.obstacles[i];
            
            // Base movement (World scrolling)
            obs.mesh.position.z += moveDist;
            if(obs.hitbox) obs.hitbox.position.z += moveDist;

            // Extra movement for trains (Moving TOWARDS player)
            if (obs.type === 'moving') {
                const trainVelocity = currentSpeed * GAME_CONFIG.trainSpeedMultiplier;
                obs.mesh.position.z += trainVelocity * dt;
            }

            // Update bounding box for collision detection
            const targetMesh = obs.hitbox || obs.mesh;
            obs.box.setFromObject(targetMesh);
            obs.box.expandByScalar(-0.1); // Small forgiveness margin

            // Cleanup if passed player significantly
            if (obs.mesh.position.z > GAME_CONFIG.playerStartZ + 30) {
                scene.remove(obs.mesh);
                if(obs.hitbox) scene.remove(obs.hitbox);
                this.obstacles.splice(i, 1);
            }
        }

        // Coins Update
        for (let i = this.coins.length - 1; i >= 0; i--) {
            let coin = this.coins[i];
            coin.mesh.position.z += moveDist;
            coin.mesh.rotation.y += 3 * dt; // Spin
            
            coin.box.setFromObject(coin.mesh);

            if (coin.mesh.position.z > GAME_CONFIG.playerStartZ + 20) {
                scene.remove(coin.mesh);
                this.coins.splice(i, 1);
            }
        }
    }

    reset() {
        // Clear all active entities
        this.obstacles.forEach(o => { scene.remove(o.mesh); if(o.hitbox) scene.remove(o.hitbox); });
        this.coins.forEach(c => { scene.remove(c.mesh); });
        this.obstacles = [];
        this.coins = [];
        
        // Reset chunks
        for(let i=0; i<this.chunks.length; i++) {
            this.chunks[i].position.z = -i * GAME_CONFIG.chunkLength;
        }
        
        // Reseed first few safe chunks
        for(let i=1; i<GAME_CONFIG.visibleChunks; i++) {
             this.generateHazards(-i * GAME_CONFIG.chunkLength);
        }
    }

    setupCutscene() {
        this.cutsceneGroup = new THREE.Group();
        
        // Bank Building behind player's starting position (facing the player)
        const bankGeo = new THREE.BoxGeometry(20, 20, 10);
        const bank = new THREE.Mesh(bankGeo, this.mats.bank);
        bank.position.set(0, 10, GAME_CONFIG.playerStartZ - 15);
        bank.castShadow = true;
        this.cutsceneGroup.add(bank);

        // Police Lights (Red and Blue)
        this.redLight = new THREE.PointLight(0xff0000, 5, 50);
        this.redLight.position.set(-6, 8, GAME_CONFIG.playerStartZ - 10);
        this.blueLight = new THREE.PointLight(0x0000ff, 0, 50);
        this.blueLight.position.set(6, 8, GAME_CONFIG.playerStartZ - 10);
        this.cutsceneGroup.add(this.redLight, this.blueLight);
        
        // Darken ambient light for dramatic police light effect
        this.oldAmbientIntensity = ambientLight.intensity;
        ambientLight.intensity = 0.2;

        scene.add(this.cutsceneGroup);
    }
    
    updatePoliceLights(time) {
        if(this.redLight && this.blueLight) {
            const flash = Math.sin(time * 15); // Fast flash rate
            this.redLight.intensity = flash > 0.5 ? 5 : 0;
            this.blueLight.intensity = flash < -0.5 ? 5 : 0;
        }
    }
    
    cleanupCutscene() {
        if(this.cutsceneGroup) {
            scene.remove(this.cutsceneGroup);
            this.cutsceneGroup = null;
            ambientLight.intensity = this.oldAmbientIntensity; // Restore lighting
        }
    }
}

    uiMenu.classList.remove('hidden');
    uiCharSelect.classList.add('hidden');
    uiGameOver.classList.add('hidden');
    uiHUD.classList.add('hidden');
    
    // Reset camera for menu view
    camera.position.set(0, 10, GAME_CONFIG.playerStartZ + 25);
    camera.lookAt(0, 5, 0);
}

    currentState = GameState.CHAR_SELECT;
    uiMenu.classList.add('hidden');
    uiCharSelect.classList.remove('hidden');
    
    // Move camera to look closely at character
    camera.position.set(0, 5, GAME_CONFIG.playerStartZ + 10);

function startGame() {
    audio.init(); // Must be initialized on user gesture
    
    currentState = GameState.CUTSCENE;
    cutsceneTime = 0;
    score = 0;
    coins = 0;
    distanceTraveled = 0;
    gameSpeed = 0; // Starts at 0 during cutscene
    
    player.reset();
    world.reset();
    world.setupCutscene();
    
    // Player starts by facing the bank (Rotation Math.PI)
    player.group.rotation.y = Math.PI;
    
    // Cinematic camera angle: Front-side view of the player
    camera.position.set(8, 4, GAME_CONFIG.playerStartZ - 8);
    camera.lookAt(player.group.position.x, player.group.position.y + 2, player.group.position.z);
    
    uiMenu.classList.add('hidden');
    uiCharSelect.classList.add('hidden');
    uiGameOver.classList.add('hidden');
    uiHUD.classList.add('hidden'); // Hide HUD during cutscene
}

function triggerGameOver() {
    currentState = GameState.GAMEOVER;
    audio.playCrash();
    
    // Death animation
    particles.emit(player.group.position.x, player.group.position.y + 1, player.group.position.z, 0xff0000, 40, 2);
    player.group.rotation.x = -Math.PI / 2; // Fall flat
    
    setTimeout(() => {
        uiHUD.classList.add('hidden');
        uiGameOver.classList.remove('hidden');
        document.getElementById('final-score').innerText = Math.floor(score);
        document.getElementById('final-coins').innerText = coins;
    }, 1000);
}

    elScore.innerText = `Score: ${Math.floor(score)}`;
    elCoins.innerText = coins;
}

// Inputs (Keyboard)
window.addEventListener('keydown', (e) => {
    if (currentState !== GameState.PLAYING) return;
    switch(e.code) {
        case 'ArrowLeft': case 'KeyA': player.moveLeft(); break;
        case 'ArrowRight': case 'KeyD': player.moveRight(); break;
        case 'ArrowUp': case 'KeyW': case 'Space': player.jump(); break;
        case 'ArrowDown': case 'KeyS': player.duck(); break;
    }
});

// Inputs (Touch Swipe)
let touchStartX = 0;
let touchStartY = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: false});

window.addEventListener('touchend', e => {
    if (currentState !== GameState.PLAYING) return;
    let dx = e.changedTouches[0].screenX - touchStartX;
    let dy = e.changedTouches[0].screenY - touchStartY;
    
    if (Math.abs(dx) > Math.abs(dy)) { // Horizontal
        if (Math.abs(dx) > 30) { dx > 0 ? player.moveRight() : player.moveLeft(); }
    } else { // Vertical
        if (Math.abs(dy) > 30) { dy < 0 ? player.jump() : player.duck(); }
    }
}, {passive: false});

// Window Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Remove Loading Screen
window.onload = () => {
    document.getElementById('loading-screen').classList.add('hidden');
    showMenu();
};

// ==========================================
// 6. MAIN GAME LOOP
// ==========================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent tunnelling on lag
    
    if (currentState === GameState.CUTSCENE) {
        cutsceneTime += dt;
        world.updatePoliceLights(cutsceneTime);
        
        // Phase 1: Drama (0 - 1.5s) - Staring at the bank
        if (cutsceneTime < 1.5) {
            // Hold position
        }
        // Phase 2: Action! Turn and run, camera swoops (1.5s - 3.5s)
        else if (cutsceneTime < 3.5) {
            const t = (cutsceneTime - 1.5) / 2.0; 
            
            // Turn player around smoothly
            player.group.rotation.y = THREE.MathUtils.lerp(Math.PI, 0, Math.min(t * 2, 1)); 
            
            // Fake running animation
            player.animTime += dt * GAME_CONFIG.baseSpeed * 0.7;
            const swing = Math.sin(player.animTime) * 1.5; 
            player.armL.rotation.x = swing; player.armR.rotation.x = -swing;
            player.legL.rotation.x = -swing; player.legR.rotation.x = swing;
            
            // Camera swoop to behind player (Gameplay position)
            const targetCamPos = new THREE.Vector3(0, 8, GAME_CONFIG.playerStartZ + 18);
            camera.position.lerp(targetCamPos, dt * 3);
            camera.lookAt(player.group.position.x * 0.2, 3, player.group.position.z - 20);
        }
        // Phase 3: Start Gameplay seamlessly
        else {
            currentState = GameState.PLAYING;
            gameSpeed = GAME_CONFIG.baseSpeed * player.charData.stats.speedBase;
            uiHUD.classList.remove('hidden');
            elMultiplier.innerText = `Multiplier: ${player.charData.stats.scoreMult}x`;
            world.cleanupCutscene();
            
            // Reset player anim time to sync with real game speed
            player.animTime = 0;
            player.group.rotation.y = 0;
        }
    }
    else if (currentState === GameState.PLAYING) {
        // Accelerate difficulty
        gameSpeed += (GAME_CONFIG.speedAcceleration * player.charData.stats.speedBase) * dt;
        if(gameSpeed > GAME_CONFIG.maxSpeed) gameSpeed = GAME_CONFIG.maxSpeed;
        
        // Score calculation (Distance * Character Multiplier)
        distanceTraveled += (gameSpeed * dt);
        score += (gameSpeed * dt * 0.2) * player.charData.stats.scoreMult;

        // Core Updates
        player.update(dt);
        world.update(dt, gameSpeed);
        
        // Collisions: Obstacles & Trains
        for (let obs of world.obstacles) {
            if (checkCollision(player.boundingBox, obs.box)) {
                triggerGameOver();
                break;
            }
        }
        
        // Collisions: Coins
        for (let i = world.coins.length - 1; i >= 0; i--) {
            let coin = world.coins[i];
            if (checkCollision(player.boundingBox, coin.box)) {
                coins += 1;
                score += 10 * player.charData.stats.scoreMult;
                audio.playCoin();
                particles.emit(coin.mesh.position.x, coin.mesh.position.y, coin.mesh.position.z, 0xffd700, 8);
                
                scene.remove(coin.mesh);
                world.coins.splice(i, 1);
            }
        }
        
        // Dynamic Camera: Follow player slightly, maintain offset
        const targetCamX = player.group.position.x * 0.4; // Subtle pan
        camera.position.x += (targetCamX - camera.position.x) * 5 * dt;
        camera.position.y = 8 + (player.group.position.y * 0.2); // Look up slightly on jump
        camera.position.z = GAME_CONFIG.playerStartZ + 18;
        camera.lookAt(player.group.position.x * 0.2, 3, player.group.position.z - 20);

        // Throttle UI updates to save performance
        if (Math.random() < 0.1) updateHUD();
    } else if (currentState === GameState.MENU || currentState === GameState.CHAR_SELECT) {
        // Idle animation for main menu background
        world.update(dt, GAME_CONFIG.baseSpeed * 0.2); // slow pan
    }
    
    particles.update(dt);
    renderer.render(scene, camera);
}

// Kickoff
animate();
</script>
</body>
